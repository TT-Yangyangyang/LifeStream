services:
  postgres:
    image: postgres:16-alpine
    container_name: lifestream-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lifestream_internal

volumes:
  postgres_data:
    name: lifestream_postgres_data

networks:
  lifestream_internal:
    name: lifestream_internal
    driver: bridge